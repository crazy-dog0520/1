# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8 object detection model with P3-P5 outputs. For Usage examples see https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 2  # fish, human
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]  # YOLOv8n summary: 225 layers,  3157200 parameters,  3157184 gradients,   8.9 GFLOPs
  s: [0.33, 0.50, 1024]  # YOLOv8s summary: 225 layers, 11166560 parameters, 11166544 gradients,  28.8 GFLOPs
  m: [0.67, 0.75, 768]   # YOLOv8m summary: 295 layers, 25902640 parameters, 25902624 gradients,  79.3 GFLOPs
  l: [1.00, 1.00, 512]   # YOLOv8l summary: 365 layers, 43691520 parameters, 43691504 gradients, 165.7 GFLOPs
  x: [1.00, 1.25, 512]   # YOLOv8x summary: 365 layers, 68229648 parameters, 68229632 gradients, 258.5 GFLOPs

# 0-P1/2
# 1-P2/4
# 2-P3/8
# 3-P4/16
# 4-P5/32

backbone:
  # [from, repeats, module, args]
  - [-1, 1, starnet_s050, []]  # 4  把图片从像素变成多尺度的语义特征（P1~P5）
  - [-1, 1, SPPF, [1024, 5]]  # 5  让最深层的特征拥有更大的感受野，为后续检测大目标做准备

# YOLOv8.0n head
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 6  把特征图放大到2倍  最近邻插值
  - [[-1, 3], 1, Concat, [1]]  # 7 cat backbone P4  将放大后的与P4拼接，为高层语义增加细节
  - [-1, 3, C2f_Star_CAA, [512]]  # 8  将拼接后的图片做三次C2f_Star_CAA处理

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 9
  - [[-1, 2], 1, Concat, [1]]  # 10 cat backbone P3
  - [-1, 3, C2f_Star_CAA, [256]]  # 11 (P3/8-small)  层11 是 FPN 自顶向下路径的终点，也是第一个真正用于检测的特征层（P3/8，专门检测小目标），最终会被送入 SCBN 检测头

  - [-1, 1, Conv, [256, 3, 2]] # 12  池化只做空间压缩，没有学习参数。带步长的卷积边压缩边提特征，可以学习如何从 P3 中提取对 P4 有用的信息，效果更好。
  - [[-1, 8], 1, Concat, [1]]  # 13 cat head P4 处理后的P4
  - [-1, 3, C2f_Star_CAA, [512]]  # 14 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 15  输出512通道，卷积核3×3，步长2
  - [[-1, 5], 1, Concat, [1]]  # 16 cat head P5
  - [-1, 3, C2f_Star_CAA, [1024]]  # 17 (P5/32-large)

  - [[11, 14, 17], 1, SCBN, [nc, 256]]  # Detect(P3, P4, P5)
